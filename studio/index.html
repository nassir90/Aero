<!doctype html>
<meta charset="utf-8">
<title>Aero Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Open+Sans:wght@600;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  body { margin: 0; background: #111; color: #ccc; font: 12px system-ui; }
  #out { width: 360px; height: 640px; display: block; }
  iframe { position: absolute; left: 400px; top: 0; width: 960px; height: 820px; border: 0; }
</style>
<canvas id="out" width="1080" height="1920"></canvas>
<iframe id="game" src="../public/games/aero/index.html#s0"></iframe>
<script>
const W = 1080, H = 1920, FPS = 30, OUT = document.getElementById('out'), X = OUT.getContext('2d');
const SCR = { x: 40, y: 540, w: 1000, h: 750 };
const C = { bg: '#0c0b10', ink: '#f2f0fa', dim: '#9a94ad', lilac: '#b9b0ff', cyan: '#7fe8ff', violet: '#6a58ff', pink: '#ff5ad6' };
let G = null, SRC = '';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ease = u => u < 0 ? 0 : u > 1 ? 1 : u * u * (3 - 2 * u);
const rnd = (a, b) => a + Math.random() * (b - a);

async function boot() {
  await new Promise(r => { const f = document.getElementById('game'); if (f.contentWindow && f.contentWindow.__aeroJump) r(); else f.onload = r; });
  G = document.getElementById('game').contentWindow;
  await document.fonts.load('700 40px Silkscreen'); await document.fonts.load('600 40px "Open Sans"'); await document.fonts.load('400 20px "IBM Plex Mono"');
  SRC = await fetch('../public/games/aero/index.html').then(r => r.text());
  const imgs = {};
  for (const n of ['v01_start', 'v01_level', 'v01_reveal', 'v02_reveal', 'v02_level', 'v04_climb', 'v05_capsules', 'v06_lumpy', 'v07_plain', 'v08_straight', 'v13_ghost', 'v15_player'])
    imgs[n] = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = 'shots/' + n + '.jpg'; });
  window.IMG = imgs;
  return 'ready';
}

function grab(name) { const i = SRC.indexOf(name); if (i < 0) return name; let d = 0, j = SRC.indexOf('{', i); for (; j < SRC.length; j++) { if (SRC[j] === '{') d++; else if (SRC[j] === '}') { d--; if (!d) break; } } return SRC.slice(i, j + 1); }
const codeLines = names => names.flatMap(n => grab(n).split('\n')).map(l => l.replace(/\s+$/, '')).filter(l => l.trim().length > 3);

function background(t, tint = '#1a1530') {
  X.fillStyle = C.bg; X.fillRect(0, 0, W, H);
  const g = X.createRadialGradient(W / 2, H * .45, 100, W / 2, H * .45, H * .8); g.addColorStop(0, tint); g.addColorStop(1, C.bg);
  X.fillStyle = g; X.fillRect(0, 0, W, H);
}
function header(label, t) {
  X.font = '700 34px Silkscreen'; X.fillStyle = C.lilac; X.textAlign = 'left'; X.textBaseline = 'top';
  X.fillText('AERO', 60, 90); X.font = '400 28px Silkscreen'; X.fillStyle = C.dim; X.fillText(label, 60, 140);
  X.fillStyle = C.lilac; X.fillRect(60, 188, 120 + 40 * Math.sin(t * 2), 4);
}
function screen(src, opts = {}) {
  const { x, y, w, h } = opts.rect || SCR;
  X.save(); X.shadowColor = 'rgba(120,100,255,.45)'; X.shadowBlur = 40; X.fillStyle = '#000'; X.fillRect(x - 4, y - 4, w + 8, h + 8); X.restore();
  X.imageSmoothingEnabled = false;
  if (src) { if (opts.square) { const s = h; X.fillStyle = '#000'; X.fillRect(x, y, w, h); X.drawImage(src, x + (w - s) / 2, y, s, s); } else X.drawImage(src, x, y, w, h); }
  X.imageSmoothingEnabled = true;
  X.strokeStyle = 'rgba(185,176,255,.8)'; X.lineWidth = 3; X.strokeRect(x - 2, y - 2, w + 4, h + 4);
}
function wrap(text, maxW) { const words = text.split(' '), lines = []; let l = ''; for (const w of words) { const t = l ? l + ' ' + w : w; if (X.measureText(t).width > maxW && l) { lines.push(l); l = w; } else l = t; } if (l) lines.push(l); return lines; }
function captions(chunks, t, D) {
  const total = chunks.reduce((a, c) => a + c.length + 8, 0); let acc = 0, cur = chunks[chunks.length - 1];
  for (const c of chunks) { const d = (c.length + 8) / total * (D - .6); if (t < acc + d) { cur = c; break; } acc += d; }
  X.font = '800 58px "Open Sans"'; X.textAlign = 'center'; X.textBaseline = 'middle';
  const lines = wrap(cur, 920); const y0 = 1420 + (3 - lines.length) * 34;
  lines.forEach((l, i) => { X.lineWidth = 12; X.strokeStyle = 'rgba(8,6,20,.9)'; X.strokeText(l, W / 2, y0 + i * 76); X.fillStyle = '#fff'; X.fillText(l, W / 2, y0 + i * 76); });
}
function chunk(vo) { return vo.replace(/\s+/g, ' ').split(/(?<=[.?!,:])\s+/).reduce((a, s) => { const last = a[a.length - 1]; if (last && (last + ' ' + s).split(' ').length <= 7 && !/[.?!]$/.test(last)) a[a.length - 1] = last + ' ' + s; else a.push(s); return a; }, []); }
function bigText(lines, y, size = 84, color = C.ink, font = 'Silkscreen') {
  X.font = `700 ${size}px ${font}`; X.textAlign = 'center'; X.textBaseline = 'middle';
  lines.forEach((l, i) => { X.fillStyle = 'rgba(0,0,0,.6)'; X.fillText(l, W / 2 + 5, y + i * size * 1.15 + 5); X.fillStyle = color; X.fillText(l, W / 2, y + i * size * 1.15); });
}
function plate(text, cx, cy, s) {
  X.font = `700 ${Math.round(120 * s)}px Silkscreen`; const tw = X.measureText(text).width;
  X.fillStyle = 'rgba(0,0,40,.35)'; X.fillRect(cx - tw / 2 - 50 * s, cy - 80 * s + 14 * s, tw + 100 * s, 160 * s);
  X.fillStyle = '#f2f1f6'; X.fillRect(cx - tw / 2 - 50 * s, cy - 80 * s, tw + 100 * s, 160 * s);
  X.fillStyle = '#2f34c9'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText(text, cx, cy + 6 * s);
}
function cursor(x, y) { X.save(); X.translate(x, y); X.fillStyle = '#fff'; X.strokeStyle = '#000'; X.lineWidth = 2; X.beginPath(); X.moveTo(0, 0); X.lineTo(0, 38); X.lineTo(10, 29); X.lineTo(17, 44); X.lineTo(24, 41); X.lineTo(17, 26); X.lineTo(29, 26); X.closePath(); X.fill(); X.stroke(); X.restore(); }

function makeField(lines, n = 70) {
  return Array.from({ length: n }, (_, i) => ({ text: Math.random() < .3 ? Array.from({ length: 6 + (Math.random() * 18 | 0) }, () => Math.random() < .5 ? '0' : '1').join('') : lines[(Math.random() * lines.length) | 0],
    x: rnd(-1.4, 1.4), y: rnd(-1.6, 1.6), z: rnd(.3, 4), v: rnd(.6, 1.6), bin: false }));
}
function field(F, t, dt, speed = 1) {
  X.textAlign = 'left'; X.textBaseline = 'middle';
  F.sort((a, b) => b.z - a.z);
  for (const p of F) {
    p.z -= p.v * dt * speed; if (p.z < .15) { p.z = 4; p.x = rnd(-1.4, 1.4); p.y = rnd(-1.6, 1.6); }
    const s = 1 / p.z, px = W / 2 + p.x * 700 * s, py = H / 2 + p.y * 700 * s, a = Math.min(1, (4 - p.z) / 1.2) * Math.min(1, p.z / .5);
    const binary = /^[01]+$/.test(p.text);
    X.font = `${binary ? 600 : 400} ${Math.max(8, 26 * s)}px "IBM Plex Mono"`;
    X.fillStyle = binary ? `rgba(127,232,255,${a * .75})` : `rgba(210,200,255,${a * .8})`;
    X.fillText(p.text.slice(0, 64), px, py);
  }
}
function codePanel(lines, t, x, y, w, h, title, typeSpeed = 40) {
  X.save(); X.fillStyle = 'rgba(16,12,32,.92)'; X.strokeStyle = 'rgba(185,176,255,.7)'; X.lineWidth = 2;
  X.beginPath(); X.roundRect(x, y, w, h, 18); X.fill(); X.stroke();
  X.fillStyle = C.lilac; X.font = '700 24px Silkscreen'; X.textAlign = 'left'; X.textBaseline = 'top'; X.fillText(title, x + 24, y + 18);
  X.font = '400 24px "IBM Plex Mono"'; const shown = Math.floor(t * typeSpeed); let used = 0;
  const maxLines = Math.floor((h - 80) / 32);
  const vis = lines.slice(Math.max(0, Math.min(lines.length - maxLines, Math.floor(shown / 38) - maxLines + 2)));
  vis.slice(0, maxLines).forEach((l, i) => {
    const room = Math.max(0, shown - used); used += l.length; const s = l.slice(0, Math.min(l.length, room));
    X.fillStyle = /\/\//.test(l) ? '#8f88b0' : /function|const|let|return/.test(l) ? '#c6b8ff' : '#e9e6f6';
    X.fillText(s.slice(0, 60), x + 24, y + 64 + i * 32);
  });
  X.restore();
}
function shotFrame(img, label, t, stamp, stampColor = '#ff4d6d') {
  const r = SCR; X.fillStyle = '#000'; X.fillRect(r.x, r.y, r.w, r.h);
  const z = 1.02 + t * .02; const iw = img.width, ih = img.height;
  const sc = Math.max(r.w / iw, r.h / ih) * z; X.save(); X.beginPath(); X.rect(r.x, r.y, r.w, r.h); X.clip();
  X.drawImage(img, r.x + r.w / 2 - iw * sc / 2, r.y + r.h / 2 - ih * sc / 2, iw * sc, ih * sc); X.restore();
  X.strokeStyle = 'rgba(185,176,255,.8)'; X.lineWidth = 3; X.strokeRect(r.x - 2, r.y - 2, r.w + 4, r.h + 4);
  X.font = '700 40px Silkscreen'; X.textAlign = 'left'; X.textBaseline = 'top'; const tw = X.measureText(label).width;
  X.fillStyle = 'rgba(12,10,24,.85)'; X.fillRect(r.x + 20, r.y + 20, tw + 32, 60); X.fillStyle = C.lilac; X.fillText(label, r.x + 36, r.y + 30);
  if (stamp && t > .25) {
    X.save(); X.translate(r.x + r.w - 220, r.y + r.h - 120); X.rotate(-.12); const k = Math.min(1, (t - .25) * 6); X.scale(1.6 - .6 * k, 1.6 - .6 * k);
    X.globalAlpha = k; X.strokeStyle = stampColor; X.lineWidth = 8; X.font = '700 56px Silkscreen'; X.textAlign = 'center'; X.textBaseline = 'middle';
    const sw = X.measureText(stamp).width; X.strokeRect(-sw / 2 - 24, -44, sw + 48, 88); X.fillStyle = stampColor; X.fillText(stamp, 0, 4); X.restore();
  }
}
function table(rows, t, x, y, title) {
  X.fillStyle = 'rgba(16,12,32,.92)'; X.strokeStyle = 'rgba(185,176,255,.7)'; X.lineWidth = 2; X.beginPath(); X.roundRect(x, y, W - 2 * x, 700, 18); X.fill(); X.stroke();
  X.fillStyle = C.lilac; X.font = '700 26px Silkscreen'; X.textAlign = 'left'; X.textBaseline = 'top'; X.fillText(title, x + 30, y + 24);
  X.font = '600 30px "IBM Plex Mono"';
  rows.forEach((r, i) => { if (t * 9 < i) return; X.fillStyle = r.hot ? '#7fe8ff' : '#e9e6f6'; X.fillText(r.text, x + 30, y + 90 + i * 44); });
}
function gameShot(opts) { return Object.assign({ kind: 'game' }, opts); }

async function enterScene(i) {
  G.__aeroJump(i); await sleep(1200);
  const S = G.__aeroActive();
  if (S.login) S.login();
  if (!S.__wrapped) { S.__u = S.update; S.update = (dt, t) => { if (G.__studio) S.__u(dt, t); }; S.__wrapped = true; }
  return S;
}
function step(dt) { G.__studio = true; G.__aeroStep(dt); G.__studio = false; }
const gl = () => G.document.getElementById('gl');
function frameEl() { return G.document.getElementById('frame'); }
function toClient(fx, fy) { const f = frameEl(), r = f.getBoundingClientRect(); return { x: r.left + fx * r.width / f.clientWidth, y: r.top + fy * r.height / f.clientHeight }; }
function worldToFrame(S, x, y, z) { const v = new G.THREE.Vector3(x, y, z).project(S.cam), f = frameEl(); return { x: (v.x * .5 + .5) * f.clientWidth, y: (-v.y * .5 + .5) * f.clientHeight }; }
function frameToScreen(fx, fy) { const f = frameEl(); return { x: SCR.x + fx / f.clientWidth * SCR.w, y: SCR.y + fy / f.clientHeight * SCR.h }; }
function ptr(el, type, fx, fy) { const c = toClient(fx, fy); el.dispatchEvent(new G.PointerEvent(type, { clientX: c.x, clientY: c.y, bubbles: true, pointerId: 1, button: 0, isPrimary: true })); }
function key(code, down, extra = {}) { G.dispatchEvent(new G.KeyboardEvent(down ? 'keydown' : 'keyup', Object.assign({ code, bubbles: true }, extra))); }
function drawMarquee() {
  const mq = G.document.getElementById('marquee'); if (mq.style.display !== 'block') return;
  const a = frameToScreen(parseFloat(mq.style.left), parseFloat(mq.style.top)), b = frameToScreen(parseFloat(mq.style.left) + parseFloat(mq.style.width), parseFloat(mq.style.top) + parseFloat(mq.style.height));
  X.fillStyle = 'rgba(90,130,255,.16)'; X.fillRect(a.x, a.y, b.x - a.x, b.y - a.y);
  X.setLineDash([12, 8]); X.strokeStyle = '#d4e0ff'; X.lineWidth = 4; X.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y); X.setLineDash([]);
}
function drawMenu() {
  const m = G.document.getElementById('ctx'); if (!m.classList.contains('on')) return;
  const a = frameToScreen(m.offsetLeft, m.offsetTop), b = frameToScreen(m.offsetLeft + m.offsetWidth, m.offsetTop + m.offsetHeight);
  X.fillStyle = 'rgba(200,210,255,.85)'; X.strokeStyle = '#fff'; X.lineWidth = 2; X.beginPath(); X.roundRect(a.x, a.y, b.x - a.x, b.y - a.y, 10); X.fill(); X.stroke();
  X.fillStyle = '#16224a'; X.font = '600 30px "Open Sans"'; X.textAlign = 'left'; X.textBaseline = 'middle'; X.fillText('Copy', a.x + 18, a.y + (b.y - a.y) * .3); X.fillText('Cut', a.x + 18, a.y + (b.y - a.y) * .72);
}

function climbBot(S, st) {
  const A = G.__aero, B = A.boxes, K = A.keys;
  const on = b => Math.abs(A.pos.x - b.x) < b.w / 2 && Math.abs(A.pos.z - b.z) < b.d / 2 && Math.abs(A.pos.y - b.top) < .06;
  if (st.i >= B.length - 1) { K.f = K.b = K.l = K.r = K.j = false; return; }
  const a = B[st.i], n = B[st.i + 1];
  if (on(n)) { st.i++; st.jumped = false; return; }
  if (A.pos.y < a.top - 3) { st.jumped = false; }
  const dx = n.x - A.pos.x, dz = n.z - A.pos.z;
  K.r = dx > .3; K.l = dx < -.3; K.b = dz > .3; K.f = dz < -.3;
  const edge = Math.abs(A.pos.x - a.x) > a.w / 2 - .5 || Math.abs(A.pos.z - a.z) > a.d / 2 - .5;
  if (!st.jumped && edge && on(a)) { K.j = true; st.jumped = true; } else K.j = st.jumped && A.vel.y > 0;
}

window.__progress = {};
async function render(name, D, segs, vo, label, voDur = D, voAt = .4) {
  const N = Math.round(D * FPS), total = segs.reduce((a, s) => a + s.w, 0), chunks = chunk(vo);
  let t0 = 0; const spans = segs.map(s => { const d = s.w / total * D; const sp = { s, a: t0, b: t0 + d }; t0 += d; return sp; });
  let cur = null, S = null;
  window.__progress[name] = { done: 0, N };
  for (let f = 0; f < N; f++) {
    const t = f / FPS, dt = 1 / FPS, sp = spans.find(p => t < p.b) || spans[spans.length - 1], lt = t - sp.a, L = sp.b - sp.a;
    if (cur !== sp) { cur = sp; S = null; if (sp.s.scene != null) { S = await enterScene(sp.s.scene); if (sp.s.setup) await sp.s.setup(S, L); } else if (sp.s.init) sp.s.init(L); }
    background(t, sp.s.tint);
    if (sp.s.scene != null) { if (sp.s.frame) sp.s.frame(S, lt, dt, L); step(dt); }
    sp.s.draw(S, lt, dt, L, t);
    if (!sp.s.noHeader) header(label, t);
    if (window.KICKER && !sp.s.noCaps && !sp.s.noKicker) { X.font = '700 60px Silkscreen'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillStyle = 'rgba(0,0,0,.5)'; X.fillText(KICKER, W / 2 + 4, 394); X.fillStyle = C.ink; X.fillText(KICKER, W / 2, 390); }
    if (!sp.s.noCaps && t >= voAt && t < voAt + voDur + .3) captions(chunks, t - voAt, voDur);
    const edgeT = Math.min(lt, L - lt); if (edgeT < .08 && f > 0) { X.fillStyle = `rgba(255,255,255,${(.08 - edgeT) * 3})`; X.fillRect(0, 0, W, H); }
    const blob = await new Promise(r => OUT.toBlob(r, 'image/jpeg', .9));
    await fetch(`http://localhost:8792/${name}/f${String(f).padStart(5, '0')}.jpg`, { method: 'PUT', body: blob });
    window.__progress[name].done = f + 1;
  }
  return N;
}
window.boot = boot; window.render = render;
</script>
<script src="videos.js"></script>
