<!doctype html><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{width:100%;height:100%;display:block}</style>
<canvas id="c"></canvas>
<script>
const Q = new URLSearchParams(location.search);
const SET = (Q.get('set') || '').split(',').map(s => { const [name, fx, d, zoom] = s.split(':'); return { name, fx: +(fx || .5), d: +(d || 2.5), zoom: +(zoom || 1) }; });
const c = document.getElementById('c'), W = 1080, H = 1920; c.width = W; c.height = H; const g = c.getContext('2d');
let loaded = 0; SET.forEach(s => { s.img = new Image(); s.img.onload = () => loaded++; s.img.src = 'shots/' + s.name + '.jpg'; });
window.__ready = () => loaded === SET.length;
const ease = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const draw1 = (s, lt, a) => {
  const iw = s.img.naturalWidth, ih = s.img.naturalHeight, z = s.zoom * (1 + .06 * ease(lt / s.d)), sc = Math.max(W / iw, H / ih) * z;
  const dw = iw * sc, dh = ih * sc, x = (W - dw) * s.fx, y = (H - dh) / 2;
  g.globalAlpha = a; g.imageSmoothingEnabled = true; g.drawImage(s.img, x, y, dw, dh); g.globalAlpha = 1;
};
let t0 = null;
function draw(now) {
  if (t0 == null) t0 = now; const t = (now - t0) / 1000;
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  let acc = 0, i = 0; while (i < SET.length - 1 && t >= acc + SET[i].d) { acc += SET[i].d; i++; }
  const lt = t - acc, s = SET[i];
  if (i > 0 && lt < .35) { draw1(SET[i - 1], SET[i - 1].d + lt, 1); draw1(s, lt, ease(lt / .35)); } else draw1(s, lt, 1);
  window.__state = { still: s.name, i };
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
